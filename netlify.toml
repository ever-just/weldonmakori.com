[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Prevent edge caching of HTML pages (fixes stale JS chunk 404s after deploys)
[[headers]]
  for = "/*"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Proxy PocketBase API through Netlify to avoid mixed content (HTTPS -> HTTP)
[[redirects]]
  from = "/pb/*"
  to = "http://142.93.78.220/:splat"
  status = 200
  force = true

# GoatCounter Analytics proxy
[[redirects]]
  from = "/stats/*"
  to = "http://142.93.78.220:8081/:splat"
  status = 200
  force = true

# GoatCounter Stats API
[[redirects]]
  from = "/gc-api/*"
  to = "http://142.93.78.220:8084/:splat"
  status = 200
  force = true

# Listmonk Newsletter proxy
[[redirects]]
  from = "/mail/*"
  to = "http://142.93.78.220:8082/:splat"
  status = 200
  force = true

# ntfy Push Notifications proxy
[[redirects]]
  from = "/notify/*"
  to = "http://142.93.78.220:8083/:splat"
  status = 200
  force = true

# Redirect weldon.lol to weldonmakori.com
[[redirects]]
  from = "https://weldon.lol/*"
  to = "https://weldonmakori.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.weldon.lol/*"
  to = "https://weldonmakori.com/:splat"
  status = 301
  force = true
